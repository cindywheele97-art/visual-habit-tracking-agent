<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Fake Chat — Glimpse E2E harness</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; margin: 0; }
  #chat { width: 480px; height: 540px; margin: 20px auto; background: #fff;
          border: 1px solid #ddd; padding: 12px; overflow-y: auto; }
  .msg { clear: both; max-width: 55%; margin: 8px 0; padding: 8px 12px;
         border-radius: 10px; font-size: 15px; line-height: 1.4; }
  .them { float: left; background: #ececec; text-align: left; }
  .me   { float: right; background: #cce4ff; text-align: right; }
  #bar { width: 480px; margin: 0 auto; display: flex; gap: 8px; }
  #box { flex: 1; padding: 8px; }
</style>
</head>
<body>
<div id="chat"></div>
<div id="bar">
  <input id="box" placeholder="我方回复…">
  <button onclick="mine()">发送</button>
  <button onclick="next()">下一条客户消息</button>
</div>
<script>
const incoming = [
  "你们这个多少钱？",
  "能便宜一点吗？",
  "什么时候能发货？",
  "可以七天无理由退换吗？",
];
let i = 0;
function add(text, side) {
  const div = document.createElement("div");
  div.className = "msg " + side;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}
function next() { if (i < incoming.length) add(incoming[i++], "them"); }
function mine() {
  const box = document.getElementById("box");
  if (box.value.trim()) { add(box.value, "me"); box.value = ""; }
}
add("你好，请问在吗？", "them");
setInterval(next, 25000);  // a new customer message every 25s
</script>
</body>
</html>
