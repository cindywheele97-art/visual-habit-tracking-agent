# Glimpse default config. Paths support "~".

[brain]
# Shell always connects here (~/.glimpse/glimpse.sock); not configurable on the shell side.
socket_path = "~/.glimpse/glimpse.sock"
event_log = "~/.glimpse/events.jsonl"
# event_log_max_bytes = 52428800  # rotation trigger; generations are ARCHIVED (dated files), never deleted
# behavior_db = "~/.glimpse/behavior.sqlite3"  # habit-event analytics store (SQLite, local-only, unredacted by design)
playbook = "~/.glimpse/playbook.md"

[llm]
model = "claude-sonnet-4-6"
max_calls_per_minute = 6
max_suggestions = 3
# Upload conversation screenshots to the LLM (look_at_conversation)?
# Pixels bypass [redaction] regexes entirely — keep off unless you accept that.
send_images = false

[tracker]
settle_ms = 800
min_ocr_confidence = 0.3  # CJK screen text scores 0.3-0.6 in Vision accurate mode
side_threshold = 0.5
ignore_patterns = ["^\\d{1,2}:\\d{2}$"]

[redaction]
# Lookarounds, not \b: \b never matches between CJK characters and digits.
patterns = ["1[3-9]\\d{9}", "(?<!\\d)\\d{10,}(?!\\d)", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "(?<![\\d-])\\d(?:[ ]?\\d){9,}(?![\\d-])", "(?<![\\d-])\\d(?:-?\\d){9,}(?![\\d-])"]
