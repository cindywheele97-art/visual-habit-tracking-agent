[project]
name = "glimpse-brain"
version = "0.1.0"
description = "Glimpse Python brain: conversation tracking + LLM suggestions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "anthropic>=0.40", "mempalace==3.4.0", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: slow tests needing the real mempalace model (opt-in)"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["glimpse_brain"]
